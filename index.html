<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kaam Dhundo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            color: #222;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        header p {
            margin: 6px 0 0;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 18px;
            margin-bottom: 16px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        .job {
            border: 1px solid #ddd;
            padding: 14px;
            border-radius: 10px;
            margin-top: 12px;
        }

        .job h3 {
            margin: 0 0 8px;
        }

        .hidden {
            display: none;
        }

        .success {
            color: green;
            font-weight: bold;
        }
    </style>
</head>

<body>

<header>
    <h1>Kaam Dhundo</h1>
    <p>Apne aas-paas ka kaam dhundhein</p>
</header>

<div class="container">

    <!-- LOCATION -->
    <div class="card">
        <h2>📍 Aapki Location</h2>

        <input
            type="text"
            id="location"
            placeholder="Apna location likhein"
        >

        <button onclick="saveLocation()">
            Location Save Karein
        </button>

        <p id="locationMessage"></p>
    </div>


    <!-- POST A JOB -->
    <div class="card">
        <h2>➕ Post a Job</h2>

        <input
            type="text"
            id="jobTitle"
            placeholder="Job ka naam"
        >

        <input
            type="text"
            id="jobLocation"
            placeholder="Job location"
        >

        <input
            type="text"
            id="salary"
            placeholder="Salary / Payment"
        >

        <textarea
            id="jobDescription"
            placeholder="Job ke baare mein likhein"
        ></textarea>

        <button onclick="postJob()">
            Job Post Karein
        </button>

        <p id="postMessage"></p>
    </div>


    <!-- AVAILABLE JOBS -->
    <div class="card">
        <h2>🔎 Available Jobs</h2>

        <div id="jobsList">
            <p>Abhi koi job available nahi hai.</p>
        </div>
    </div>


    <!-- MY APPLICATIONS -->
    <div class="card">
        <h2>📋 My Applications</h2>

        <button onclick="showMyApplications()">
            View Applications
        </button>

        <div id="myApplications"></div>
    </div>

</div>


<script>

    // JOB DATA
    let jobs = JSON.parse(localStorage.getItem("jobs")) || [];

    let applications =
        JSON.parse(localStorage.getItem("applications")) || [];


    // SAVE LOCATION
    function saveLocation() {

        const location =
            document.getElementById("location").value.trim();

        if (location === "") {
            alert("Please apna location likhein.");
            return;
        }

        localStorage.setItem("userLocation", location);

        document.getElementById("locationMessage").innerHTML =
            "✅ Location save ho gayi: " + location;
    }


    // POST JOB
    function postJob() {

        const title =
            document.getElementById("jobTitle").value.trim();

        const location =
            document.getElementById("jobLocation").value.trim();

        const salary =
            document.getElementById("salary").value.trim();

        const description =
            document.getElementById("jobDescription").value.trim();


        if (title === "" || location === "") {
            alert("Job name aur location zaroor likhein.");
            return;
        }


        const job = {
            id: Date.now(),
            title: title,
            location: location,
            salary: salary,
            description: description
        };


        jobs.push(job);

        localStorage.setItem(
            "jobs",
            JSON.stringify(jobs)
        );


        document.getElementById("jobTitle").value = "";
        document.getElementById("jobLocation").value = "";
        document.getElementById("salary").value = "";
        document.getElementById("jobDescription").value = "";


        document.getElementById("postMessage").innerHTML =
            "✅ Job successfully post ho gayi!";


        displayJobs();
    }


    // DISPLAY JOBS
    function displayJobs() {

        const jobsList =
            document.getElementById("jobsList");


        if (jobs.length === 0) {

            jobsList.innerHTML =
                "<p>Abhi koi job available nahi hai.</p>";

            return;
        }


        jobsList.innerHTML = "";


        jobs.forEach(function(job) {

            const div =
                document.createElement("div");

            div.className = "job";


            div.innerHTML = `
                <h3>${job.title}</h3>

                <p>📍 ${job.location}</p>

                <p>💰 ${job.salary || "Payment details nahi di gayi"}</p>

                <p>${job.description || ""}</p>

                <button onclick="applyJob(${job.id})">
                    Apply Karein
                </button>
            `;


            jobsList.appendChild(div);

        });
    }


    // APPLY FOR JOB
    function applyJob(jobId) {

        const job =
            jobs.find(function(item) {
                return item.id === jobId;
            });


        if (!job) {
            alert("Job nahi mili.");
            return;
        }


        const alreadyApplied =
            applications.some(function(app) {
                return app.jobId === jobId;
            });


        if (alreadyApplied) {
            alert("Aap is job ke liye already apply kar chuke hain.");
            return;
        }


        applications.push({
            jobId: job.id,
            title: job.title,
            location: job.location,
            salary: job.salary
        });


        localStorage.setItem(
            "applications",
            JSON.stringify(applications)
        );


        alert("✅ Job ke liye application submit ho gayi!");

    }


    // SHOW MY APPLICATIONS
    function showMyApplications() {

        const box =
            document.getElementById("myApplications");


        if (applications.length === 0) {

            box.innerHTML = `
                <p>Abhi tak aapne kisi job ke liye apply nahi kiya hai.</p>
            `;

            return;
        }


        box.innerHTML = `
            <h3>Aapki Applications</h3>
        `;


        applications.forEach(function(app) {

            const div =
                document.createElement("div");

            div.className = "job";


            div.innerHTML = `
                <h3>${app.title}</h3>

                <p>📍 ${app.location}</p>

                <p>💰 ${app.salary || "Payment details nahi di gayi"}</p>

                <p class="success">
                    ✅ Applied
                </p>
            `;


            box.appendChild(div);

        });

    }


    // LOAD SAVED LOCATION
    const savedLocation =
        localStorage.getItem("userLocation");


    if (savedLocation) {

        document.getElementById("location").value =
            savedLocation;

    }


    // LOAD JOBS
    displayJobs();

</script>

</body>
</html>
